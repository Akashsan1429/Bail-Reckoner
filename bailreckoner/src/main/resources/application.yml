server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: bailreckoner
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bailreckoner?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        type:
          preferred_uuid_jdbc_type: CHAR
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:key}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-flash-latest}

jwt:
  secret: ${JWT_SECRET:jwt}
  expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
